<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#28346a" />
    <meta name="description" content="PolyViewer cinematic replay editor for PolyTrack 0.6.2" />
    <link rel="preload" href="/forced_square.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/images/logo.svg" as="image" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <title>PolyViewer · PolyTrack 0.6.2</title>
    <script>
      window.polytrackModConfiguration = {
        modName: "PolyViewer",
        author: "TheSocialNetwork35",
        unblocked: true,
      };
      window.__POLYVIEWER_INPUT_ACTIVE__ = false;
      for (const eventName of ["keydown", "keyup", "keypress"]) {
        window.addEventListener(
          eventName,
          (event) => {
            const target = event.target;
            const isTyping = target instanceof HTMLElement && (
              target.matches("input, textarea, select") || target.isContentEditable
            );
            if (isTyping) return;
            if (event.code === "F6" || window.__POLYVIEWER_INPUT_ACTIVE__) {
              window.dispatchEvent(
                new CustomEvent("polyviewer:key", {
                  detail: {
                    eventType: eventName,
                    code: event.code,
                    shiftKey: event.shiftKey,
                    repeat: event.repeat,
                  },
                }),
              );
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true,
        );
      }
    </script>
    <script defer src="/error_screen.bundle.js"></script>
    <script defer src="/main.bundle.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>
  </body>
</html>
